name: Проверка кода

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Установка зависимостей
        run: bun install --frozen-lockfile

      # TanStack Router generates routeTree.gen.ts during Vite build.
      # Keep that generated file out of commits, but generate it before tsgo.
      - name: Сборка панели и генерация маршрутов
        run: bun run build

      - name: Проверка типов
        run: bun run typecheck

      - name: Проверка сценариев и прав доступа
        run: bun run test

      - name: Проверка правил автоматического выпуска ядра
        run: node --test .github/scripts/core-update-policy.test.cjs

      - name: Зависимости клиента
        working-directory: desktop
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Тесты клиента
        working-directory: desktop
        timeout-minutes: 4
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          timeout --signal=TERM --kill-after=10s 180s xvfb-run -a npm test

      - name: Проверка файлов приложения
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/launcher.cjs
          node --check desktop/proxy-check.cjs
          node --check desktop/fingerprint-preload.cjs
