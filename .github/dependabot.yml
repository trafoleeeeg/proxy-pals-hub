version: 2
updates:
  # Electron contains the Chromium, Node.js and V8 runtime shipped to users.
  # Electron is watched daily and changed only together with a tested native build.
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    ignore:
      - dependency-name: electron

  # Keep the panel and its build tooling current as well.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
