<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Umbra</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #111217; color: #e7e8ee;
        font-family: "Inter Tight", "Segoe UI", system-ui, sans-serif;
      }
      .box { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .logo {
        width: 44px; height: 44px; border-radius: 12px;
        background: linear-gradient(135deg, #6a5bff, #3f8cff);
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 20px; color: #fff;
      }
      .title { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
      .hint { font-size: 12px; color: #8c8fa3; }
      .bar { width: 180px; height: 3px; border-radius: 3px; background: #23252f; overflow: hidden; }
      .bar span {
        display: block; width: 40%; height: 100%; border-radius: 3px;
        background: linear-gradient(90deg, #6a5bff, #3f8cff);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div class="box" role="status" aria-live="polite">
      <div class="logo">U</div>
      <div class="title">Umbra запускается</div>
      <div class="bar"><span></span></div>
      <div class="hint" id="umbra-status">Подключаемся к панели и восстанавливаем профили…</div>
    </div>
  </body>
</html>
