name: Проверка кода

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Установка зависимостей
        run: bun install --frozen-lockfile

      - name: Проверка типов
        run: bun run typecheck

      - name: Проверка сценариев и прав доступа
        run: bun run test

      - name: Сборка панели
        run: bun run build

      - name: Зависимости клиента
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --ignore-scripts

      - name: Тесты клиента
        working-directory: desktop
        run: npm test

      - name: Проверка файлов приложения
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/launcher.cjs
          node --check desktop/proxy-check.cjs
          node --check desktop/fingerprint-preload.cjs
