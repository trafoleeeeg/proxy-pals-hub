name: Umbra Desktop — Windows

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      automatic_release:
        description: Publish a verified stable core update after the tag build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Tag must match desktop version')"

      - name: Install dependencies
        working-directory: desktop
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Test Windows runtime
        working-directory: desktop
        env:
          UMBRA_REQUIRE_NATIVE: "1"
          UMBRA_REQUIRE_DPAPI: "1"
        run: npm test

      - name: Build Windows app
        working-directory: desktop
        run: npm run build:win

      - name: Verify updater artifacts
        working-directory: desktop
        run: npm run verify:release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: umbra-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    concurrency:
      group: umbra-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify automatic release provenance
        if: github.event_name == 'workflow_dispatch' && inputs.automatic_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/verify-core-release.cjs

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: umbra-windows
          path: desktop/dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(desktop/dist/latest.yml desktop/dist/*.blockmap desktop/dist/*.exe)

          for file in "${files[@]}"; do
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "$GITHUB_REF_NAME" "$file" --clobber; then
                uploaded=true
                break
              fi
              echo "Upload attempt ${attempt} failed for ${file}; retrying..."
              sleep $((attempt * 15))
            done

            if [[ "$uploaded" != true ]]; then
              echo "Failed to upload ${file} after 5 attempts" >&2
              exit 1
            fi
          done
