name: Umbra Desktop — Windows

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Tag must match desktop version')"

      - name: Install dependencies
        working-directory: desktop
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Test Windows runtime
        working-directory: desktop
        env:
          UMBRA_REQUIRE_NATIVE: "1"
          UMBRA_REQUIRE_DPAPI: "1"
        run: npm test

      - name: Build Windows app
        working-directory: desktop
        run: npm run build:win

      - name: Verify updater artifacts
        working-directory: desktop
        run: npm run verify:release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: umbra-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
