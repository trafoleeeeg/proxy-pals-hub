name: Umbra Desktop — Windows

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-linux:
    name: Linux — Electron tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb libglib2.0-0 libnss3 libnspr4 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdbus-1-3 libcairo2 \
            libgtk-3-0 libpango-1.0-0 libx11-6 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxrandr2 libgbm1 \
            libexpat1 libxcb1 libxkbcommon0 libudev1 libasound2t64

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: desktop
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Check desktop JavaScript syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/launcher.cjs
          node --check desktop/preload.cjs
          node --check desktop/proxy-check.cjs
          node --check desktop/fingerprint-preload.cjs
          node --check desktop/runtime/browser.cjs
          node --check desktop/runtime/browser-ui.cjs
          node --check desktop/runtime/profile-runtime.cjs

      - name: Check TypeScript
        run: bun run typecheck

      - name: Run full desktop test suite
        working-directory: desktop
        timeout-minutes: 8
        env:
          UMBRA_REQUIRE_NATIVE: "1"
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npm test

  build-windows:
    name: Windows — package artifact
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Tag must match desktop version')"

      - name: Install dependencies
        working-directory: desktop
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Build Windows app
        working-directory: desktop
        run: npm run build:win

      - name: Verify updater artifacts
        working-directory: desktop
        run: npm run verify:release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: umbra-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 3

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    concurrency:
      group: umbra-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: umbra-windows
          path: desktop/dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(desktop/dist/latest.yml desktop/dist/*.blockmap desktop/dist/*.exe)

          for file in "${files[@]}"; do
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "$GITHUB_REF_NAME" "$file" --clobber; then
                uploaded=true
                break
              fi
              echo "Upload attempt ${attempt} failed for ${file}; retrying..."
              sleep $((attempt * 15))
            done

            if [[ "$uploaded" != true ]]; then
              echo "Failed to upload ${file} after 5 attempts" >&2
              exit 1
            fi
          done
