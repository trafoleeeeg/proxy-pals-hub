name: Engine update watch

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: engine-update-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test update monitor
        run: node --test .github/scripts/engine-update-monitor.test.cjs
      - name: Check stable Electron and Chromium
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/engine-update-monitor.cjs
